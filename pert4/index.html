<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tantangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="input-container">
    
        <label for="kodeBarang">Kode Barang:
        <select name="kodeBarang" id="kodeBarang">
            <option value="SPT">SPT</option> 
            <option value="SND">SND</option> <!-- Pilihan kode barang SND -->
            <option value="TST">TST</option> <!-- Pilihan kode barang TST -->
            <option value="TOP">TOP</option> <!-- Pilihan kode barang TOP -->
        </select>
        </label>
        <label for="jumlahBarang">Jumlah Barang:</label>
        <input type="number" id="jumlahBarang" name="jumlahBarang">
        <button class="simpan-btn" onclick="simpan()">Simpan</button>
        <button class="reset-btn" onclick="kosongkan()">Reset</button>
    </div>
    <p id="dataPenjualan"></p> 
    <script src="script.js"></script>
</body>
</html>
