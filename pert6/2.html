<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket PO</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .seat {
            width: 50px;
            height: 50px;
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .driver-seat {
            background-color: #FF5722;
        }
        .seat.selected {
            background-color: #808080; /* Change color to gray */
        }
        .seat.booked {
            background-color: #FFD700; /* Color for booked seats */
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
<div class="container text-center mt-5">
    <h1>Nama Usaha</h1>
    <div class="form-inline justify-content-center my-4">
        <label for="seatNumber" class="mr-2">Jumlah Kursi:</label>
        <input type="number" id="seatNumber" min="1" class="form-control mr-2" placeholder="Jumlah Kursi">
        <button id="startButton" class="btn btn-primary mr-2" onclick="generateSeats()" disabled>Mulai</button>
        <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
    </div>

    <div id="seatContainer" class="d-flex flex-wrap justify-content-center mb-4"></div>

    <div class="input-group mb-4">
        <input type="text" id="customerName" class="form-control" placeholder="Nama Pemesan">
        <div class="input-group-append">
            <button class="btn btn-success" onclick="saveBooking()">Simpan</button>
        </div>
    </div>

    <!-- Booking Table -->
    <table id="bookingTable" class="table table-bordered hidden">
        <thead class="thead-light">
            <tr>
                <th>No Kursi</th>
                <th>Nama Pemesan</th>
                <th>Aksi</th> <!-- New Action Column -->
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Summary Table -->
    <div id="summaryTableContainer" class="mt-4 hidden">
        <h3>Rincian Pemesanan</h3>
        <table id="summaryTable" class="table table-bordered">
            <thead class="thead-light">
                <tr>
                    <th>Nama Pemesan</th>
                    <th>Total Kursi</th>
                    <th>Total Bayar</th> <!-- New column for total payment -->
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
    const seatContainer = document.getElementById('seatContainer');
    const bookingTable = document.getElementById('bookingTable');
    const bookingTableBody = bookingTable.querySelector('tbody');
    const summaryTableBody = document.getElementById('summaryTable').querySelector('tbody');

    const seatPrice = 100000; // Set your price per seat here

    document.getElementById('seatNumber').addEventListener('input', function() {
        document.getElementById('startButton').disabled = !this.value;
    });
    
    function generateSeats() {
        seatContainer.innerHTML = '';
        bookingTableBody.innerHTML = '';
        bookingTable.classList.remove('hidden');
        
        const seatCount = parseInt(document.getElementById('seatNumber').value);
        
        for (let i = 1; i <= seatCount; i++) {
            const seat = document.createElement('div');
            seat.className = 'seat';
            seat.innerText = i;
            seat.onclick = () => toggleSeatSelection(seat);
            seatContainer.appendChild(seat);

            const row = bookingTableBody.insertRow();
            row.insertCell(0).innerText = i;
            row.insertCell(1).innerHTML = `<input type="text" class="form-control" id="nameInput${i}" placeholder="Nama Pemesan" readonly>`;
            
            // Add delete button
            const deleteButton = document.createElement('button');
            deleteButton.className = 'btn btn-danger btn-sm';
            deleteButton.innerText = 'Hapus';
            deleteButton.onclick = () => deleteBooking(row, seat);
            row.insertCell(2).appendChild(deleteButton);
        }

        // Adjust layout
        adjustSeatLayout(seatCount);
    }

    function toggleSeatSelection(seat) {
        if (!seat.classList.contains('booked')) { // Only allow selection if not already booked
            seat.classList.toggle('selected');
        }
    }

    function saveBooking() {
        const selectedSeats = document.querySelectorAll('.seat.selected');
        const customerName = document.getElementById('customerName').value.trim();

        if (selectedSeats.length === 0 || !customerName) {
            alert("Pilih kursi dan masukkan nama pemesan.");
            return;
        }

        let totalSeats = selectedSeats.length; // Count of booked seats
        let totalPayment = totalSeats * seatPrice; // Calculate total payment

        selectedSeats.forEach(seat => {
            const seatNumber = seat.innerText;
            const nameInput = document.getElementById(`nameInput${seatNumber}`);
            
            nameInput.value = customerName;

            // Mark the seat as booked and change its color
            seat.classList.remove('selected');
            seat.classList.add('booked'); // Change to booked state
        });

        // Update summary table
        updateSummary(customerName, totalSeats, totalPayment);

        document.getElementById('customerName').value = '';
    }

    function updateSummary(customerName, totalSeats, totalPayment) {
        summaryTableBody.innerHTML += `<tr><td>${customerName}</td><td>${totalSeats}</td><td>Rp ${totalPayment.toLocaleString()}</td></tr>`;
        
        // Show summary table if it was hidden
        document.getElementById('summaryTableContainer').classList.remove('hidden');
    }

    function deleteBooking(row, seat) {
        const nameInput = row.cells[1].querySelector('input'); // Get the input field for the name
       
       if (nameInput.value) { // Check if there is a name to remove
           const customerName = nameInput.value; // Get customer name from input
           const totalSeatsBooked = Array.from(bookingTableBody.rows).filter(r => r.cells[1].querySelector('input').value === customerName).length; // Count how many seats are booked by this customer

           // Decrease total payment for this customer in summary table
           let totalPaymentToRemove = seatPrice; // Each deleted booking reduces payment by one seat price

           // Remove the customer's name from input field
           nameInput.value = '';

           // Update summary table
           updateSummaryOnDelete(customerName, totalSeatsBooked, totalPaymentToRemove);
       }

       seat.classList.remove('booked'); // Remove booking from the seat
       seat.classList.remove('selected'); // Remove selection from the seat
   }

   function updateSummaryOnDelete(customerName, totalSeatsBooked, totalPaymentToRemove) {
       let summaryRows = Array.from(summaryTableBody.rows);
       let summaryRowToUpdate = summaryRows.find(row => row.cells[0].innerText === customerName);

       if (summaryRowToUpdate) {
           let currentTotalSeats = parseInt(summaryRowToUpdate.cells[1].innerText);
           let currentTotalPaymentString = summaryRowToUpdate.cells[2].innerText.replace(/[^0-9]/g, '');
           let currentTotalPayment = parseInt(currentTotalPaymentString);

           currentTotalSeats -= 1; // Decrease count of seats by one
           currentTotalPayment -= totalPaymentToRemove; // Decrease payment by one seat price

           // Update summary row with new values
           summaryRowToUpdate.cells[1].innerText = currentTotalSeats;
           summaryRowToUpdate.cells[2].innerText = `Rp ${currentTotalPayment.toLocaleString()}`;
       }
   }

   function resetForm() {
       document.getElementById('seatNumber').value = '';
       document.getElementById('startButton').disabled = true;
       seatContainer.innerHTML = '';
       bookingTableBody.innerHTML = '';
       
       // Clear the summary table but keep it hidden until a new booking is made
       summaryTableBody.innerHTML = ''; 
       document.getElementById('summaryTableContainer').classList.add('hidden'); 
       
       bookingTable.classList.add('hidden');
   }

   function adjustSeatLayout(seatCount) {
      console.log("Adjusting layout for", seatCount, "seats");
      // You can implement specific layout logic here if needed.
   }
</script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
